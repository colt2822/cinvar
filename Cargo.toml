[package]
name = "cinvar"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "CINVAR — the open-source AI video creation harness"
default-run = "cinvar"
repository = "https://github.com/colt2822/cinvar"
readme = "README.md"
keywords = ["video", "ffmpeg", "mcp", "ai-agents", "blender"]
categories = ["multimedia::video", "command-line-utilities"]

[[bin]]
name = "cinvar"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.42", features = ["bundled"] }
ureq = { version = "2", features = ["json", "tls"] }
sha2 = "0.10"
rand = "0.8"
regex = "1"
base64 = "0.22"
tempfile = "3"
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
